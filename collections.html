<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grainient | Collections - 1000+ Curated Gradients</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/global.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <!-- Page Header -->
  <section style="padding: 4rem 0 2rem; border-bottom: 1px solid var(--border-subtle); background: var(--bg-secondary);">
    <div class="container">
      <div style="max-width: 650px;">
        <span class="badge-pill">LIBRARY</span>
        <h1 class="text-h2" style="margin: 0.75rem 0 0.5rem;">All Collections</h1>
        <p class="text-p-lead">
          Browse over 1,000+ hand-crafted gradient backgrounds, smooth mesh blends, noisy textures, and generative wallpapers.
        </p>
      </div>

      <!-- Controls Bar -->
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 2.5rem;">
        <!-- Category Filter Pills -->
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
          <button class="btn btn-primary btn-sm cat-pill" data-cat="all">All (1,000+)</button>
          <button class="btn btn-secondary btn-sm cat-pill" data-cat="noisy-grainy">Noisy &amp; Grainy (387)</button>
          <button class="btn btn-secondary btn-sm cat-pill" data-cat="smooth-blend">Smooth Blend (466)</button>
          <button class="btn btn-secondary btn-sm cat-pill" data-cat="animated">Animated (90)</button>
          <button class="btn btn-secondary btn-sm cat-pill" data-cat="ai-generated">AI Generated (556)</button>
        </div>

        <!-- Search & Sort Controls -->
        <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
          <input 
            type="text" 
            id="gallery-search" 
            placeholder="Search keywords or tags..." 
            style="padding: 0.5rem 1rem; border-radius: var(--radius-full); background: var(--bg-card); border: 1px solid var(--border-subtle); color: #fff; font-size: 0.85rem; width: 220px;" 
          />
          <select id="gallery-sort" style="padding: 0.5rem 1rem; border-radius: var(--radius-full); background: var(--bg-card); border: 1px solid var(--border-subtle); color: #fff; font-size: 0.85rem; cursor: pointer;">
            <option value="featured">Featured First</option>
            <option value="name">Alphabetical</option>
            <option value="pro">Pro Assets First</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- Grid Section -->
  <main style="padding: 3.5rem 0 6rem;">
    <div class="container">
      <div id="collections-grid" class="grid-cards"></div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module">
    import { initCollectionsPage } from './src/pages/collectionsPage.ts';
    initCollectionsPage('all');
  </script>
</body>
</html>
