<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grainient | Sign In</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/global.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <main style="padding: 5rem 0 7rem; flex: 1; display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 440px;">
      <div class="card-glass" style="padding: 2.5rem; text-align: center;">
        
        <div style="width: 44px; height: 44px; border-radius: 12px; background: #C2F13C; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center;">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 32 32">
            <path fill="#000" d="M24.239 15.668a10.3 10.3 0 0 0-.974-2.409c-.35-.632-.578-1.33-.596-2.051a3.54 3.54 0 0 1 .342-1.652q.12-.253.32-.526a.4.4 0 0 0-.069-.553l-.006-.005a.4.4 0 0 0-.471-.028 4.3 4.3 0 0 1-1.357.59c-1.492.363-2.763-.19-3.321-.492a.3.3 0 0 0-.376.07l-.003.005a.3.3 0 0 0 .034.421c.354.304.853.852.934 1.608.058.537-.117.97-.274 1.304-.757 1.598-2.23 3.167-2.987 3.924a.22.22 0 0 0 .014.325l.003.003a.22.22 0 0 0 .3-.015c2.367-2.4 4.96-3.357 6.396-2.488q.144.085.302.223c.413.37.636.906.655 1.462q.005.158.003.316c-.033 2.162-1.707 3.987-3.866 4.108-1.925.107-4.015-.671-5.63-2.286-1.396-1.396-2.168-3.148-2.281-4.84-.167-2.483 1.803-4.586 4.24-4.647a.215.215 0 0 0 .204-.254v-.005a.22.22 0 0 0-.175-.173 8.4 8.4 0 0 0-1.625-.137c-1.774.025-3.421.633-4.647 1.86-2.938 2.938-2.332 8.307 1.352 11.991 3.686 3.685 9.055 4.292 11.993 1.353 1.758-1.758 2.246-4.385 1.566-7.003z"/>
          </svg>
        </div>

        <h1 class="text-h3" style="margin-bottom: 0.5rem;">Welcome to Grainient</h1>
        <p class="text-p-sm" style="margin-bottom: 2rem;">Sign in to access your downloaded licenses and saved shader presets.</p>

        <form id="sign-in-form" style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
          <div>
            <label class="text-p-caption" style="display: block; margin-bottom: 0.35rem; text-transform: uppercase;">Email Address</label>
            <input type="email" required placeholder="you@company.com" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-md); background: var(--bg-primary); border: 1px solid var(--border-subtle); color: #fff; font-size: 0.9rem;" />
          </div>

          <div>
            <label class="text-p-caption" style="display: block; margin-bottom: 0.35rem; text-transform: uppercase;">License Key / Password</label>
            <input type="password" required placeholder="Enter your key or password" style="width: 100%; padding: 0.75rem 1rem; border-radius: var(--radius-md); background: var(--bg-primary); border: 1px solid var(--border-subtle); color: #fff; font-size: 0.9rem;" />
          </div>

          <button type="submit" class="btn btn-primary btn-md" style="width: 100%; margin-top: 0.75rem;">
            <span>Sign In to Vault</span>
          </button>
        </form>

        <div style="margin-top: 1.5rem; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
          <p class="text-p-caption">
            Don't have a license key yet? <a href="/pricing.html" style="color: var(--color-brand-primary); text-decoration: underline;">Get Pro Access &rarr;</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module">
    import { renderNavbar, initNavbarInteractions } from './src/components/Navbar.ts';
    import { renderFooter } from './src/components/Footer.ts';
    import { showToast } from './src/components/Toast.ts';

    document.getElementById('navbar-root').innerHTML = renderNavbar('signin');
    document.getElementById('footer-root').innerHTML = renderFooter();
    initNavbarInteractions();

    document.getElementById('sign-in-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Authentication verified! Welcome back.');
      setTimeout(() => {
        window.location.href = '/collections.html';
      }, 1200);
    });
  </script>
</body>
</html>
